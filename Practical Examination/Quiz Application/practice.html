<!DOCTYPE html>
<html lang="en">
<head>
<style>
body{ font-family: Arial; background: turquoise}

.container{
    width: 320px ;
    margin: 50px auto;
    background: white;
    padding: 15px;
    border-radius: 5px;
}
button{
    background: purple;
    color: white;
    border: none;
    padding: 5px 10px;
}
h2{
    text-align:center;
}
</style>
</head>
<body>

<div class="container">

<h2>Quiz Application</h2>

<p>1. What is 2 + 2 ?</p>
<input type = "radio" name = "q1" value = "3">3<br>
<input type = "radio" name = "q1" value = "4">4

<br><br>
<button onclick = "check()">Submit</button>

<h3 id="result"></h3>

</div>
<script>
function check(){

    let score = 0;

    let q1 = document.querySelector('input[name="q1"]:checked');

    if(q1 && q1.value === "4") score++;

    document.getElementById("result").innerText = "Score: " + score + "/5";
}


</script>
</body>
</html>
